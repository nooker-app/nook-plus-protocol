openapi: 3.1.0
info:
  title: Nook Plus Service API
  description: |
    Client API for a Nook Plus publishing service.

    This contract is the service-operation surface (invitations, signup,
    membership, publishing operations). The interoperability contract —
    Lexicon record schemas and RSS/Atom mapping — is defined separately in
    this repository and does not require this API.

    Authentication uses the caller's PDS session access token as a Bearer
    credential. Servers never store or log passwords beyond forwarding them
    to the PDS account boundary. Error responses use RFC 7807
    `application/problem+json`.

    The server URL is deployment-configured; `https://api.example.com` is a
    placeholder.
  version: 0.1.0
  contact:
    name: Nook Plus Protocol
    url: https://github.com/nooker-app/nook-plus-protocol
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://api.example.com
    description: Placeholder. Real deployments configure their own base URL.

tags:
  - name: onboarding
    description: Invitation checks and account creation
  - name: member
    description: Membership state
  - name: publishing
    description: Publication and article operations
  - name: data
    description: Export and deletion of user data

paths:
  /v1/invitations/verify:
    post:
      operationId: verifyInvitation
      tags: [onboarding]
      summary: Check whether an invitation code is currently redeemable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: Verification result. Invalid codes are a result, not an error.
          content:
            application/json:
              schema:
                type: object
                required: [redeemable]
                properties:
                  redeemable:
                    type: boolean
        default:
          $ref: "#/components/responses/Problem"

  /v1/handles/availability:
    get:
      operationId: checkHandleAvailability
      tags: [onboarding]
      summary: Check whether a handle is available on the service's PDS.
      parameters:
        - name: handle
          in: query
          required: true
          description: Fully qualified handle to check (for example `alice.handles.example.com`).
          schema:
            $ref: "#/components/schemas/Handle"
      responses:
        "200":
          description: Availability result.
          content:
            application/json:
              schema:
                type: object
                required: [handle, available]
                properties:
                  handle:
                    $ref: "#/components/schemas/Handle"
                  available:
                    type: boolean
                  reason:
                    type: string
                    description: Machine-readable reason when unavailable (for example `taken`, `reserved`, `invalid`).
        default:
          $ref: "#/components/responses/Problem"

  /v1/signup:
    post:
      operationId: signup
      tags: [onboarding]
      summary: Redeem an invitation and create the member's PDS account.
      description: |
        Creates the PDS account, verifies the resulting DID and handle
        resolution, records membership, creates the default publication, and
        returns a client session.

        The request MUST carry an `Idempotency-Key`. Retrying with the same
        key never creates a second account or DID; the server resumes or
        replays the original signup.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitationCode, handle, email, password]
              properties:
                invitationCode:
                  type: string
                  minLength: 1
                  maxLength: 128
                handle:
                  $ref: "#/components/schemas/Handle"
                displayName:
                  type: string
                  maxLength: 640
                email:
                  type: string
                  format: email
                  description: Recovery email. Forwarded to the PDS.
                password:
                  type: string
                  minLength: 8
                  maxLength: 512
                  description: Forwarded only to the PDS account boundary; never stored or logged by the service.
      responses:
        "201":
          description: Account created (or replayed for a repeated idempotency key).
          content:
            application/json:
              schema:
                type: object
                required: [did, handle, session, defaultPublication]
                properties:
                  did:
                    $ref: "#/components/schemas/Did"
                  handle:
                    $ref: "#/components/schemas/Handle"
                  session:
                    $ref: "#/components/schemas/Session"
                  defaultPublication:
                    $ref: "#/components/schemas/Publication"
                  handleResolves:
                    type: boolean
                    description: |
                      Whether public handle resolution was observed. False means
                      the record exists but has not propagated yet; the account
                      is fully usable either way, so a client MUST present this
                      as pending rather than as a failure, and MUST NOT block
                      onboarding on it.
        default:
          $ref: "#/components/responses/Problem"

  /v1/me:
    get:
      operationId: getMe
      tags: [member]
      summary: Current member state.
      security:
        - pdsSession: []
      responses:
        "200":
          description: The authenticated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Problem"

  /v1/publications:
    get:
      operationId: listPublications
      tags: [publishing]
      summary: List the member's publications.
      security:
        - pdsSession: []
      responses:
        "200":
          description: The member's publications.
          content:
            application/json:
              schema:
                type: object
                required: [publications]
                properties:
                  publications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Publication"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPublication
      tags: [publishing]
      summary: Create a publication record in the member's PDS repository.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationInput"
      responses:
        "201":
          description: Publication record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        default:
          $ref: "#/components/responses/Problem"

  /v1/publications/{rkey}:
    put:
      operationId: updatePublication
      tags: [publishing]
      summary: Replace a publication record.
      description: |
        Updates the PDS record and returns the new representation with its
        CID. Public representations follow asynchronously; when the slug
        changes, the returned URLs are the new ones.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/RecordKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationInput"
      responses:
        "200":
          description: Publication record replaced.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePublication
      tags: [publishing]
      summary: Delete a publication record.
      description: |
        Deletes the publication record only. Articles are **not**
        cascade-deleted: a service cannot remove records a user did not ask
        it to remove. Articles left referencing it stay schema-valid but are
        excluded from public representations.

        Available to suspended and revoked members. Idempotent: deleting an
        absent record succeeds.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/RecordKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Record deleted (or already absent).
        default:
          $ref: "#/components/responses/Problem"

  /v1/publications/{rkey}/urls:
    get:
      operationId: getPublicationUrls
      tags: [publishing]
      summary: Public URLs for a publication and its feeds.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/RecordKey"
      responses:
        "200":
          description: Public URLs as currently served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationUrls"
        default:
          $ref: "#/components/responses/Problem"

  /v1/articles:
    post:
      operationId: createArticle
      tags: [publishing]
      summary: Create an article record in the member's PDS repository.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Article record created. Publishing to public representations is asynchronous.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        default:
          $ref: "#/components/responses/Problem"

  /v1/articles/{rkey}:
    put:
      operationId: updateArticle
      tags: [publishing]
      summary: Replace an article record.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/RecordKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Article record replaced.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        default:
          $ref: "#/components/responses/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
    delete:
      operationId: deleteArticle
      tags: [publishing]
      summary: Delete an article record.
      description: |
        Deletes the authoritative record. Removal from public
        representations follows the documented propagation delay. Deletion
        is idempotent; deleting an absent record succeeds.

        Available to suspended and revoked members.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/RecordKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Record deleted (or already absent).
        default:
          $ref: "#/components/responses/Problem"

  /v1/exports:
    post:
      operationId: requestExport
      tags: [data]
      summary: Request an export of the member's authoritative records.
      description: Available regardless of membership status.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Export accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        default:
          $ref: "#/components/responses/Problem"

  /v1/exports/{exportId}:
    get:
      operationId: getExport
      tags: [data]
      summary: Poll an export job.
      security:
        - pdsSession: []
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service-disconnection-requests:
    post:
      operationId: requestServiceDisconnection
      tags: [data]
      summary: Disconnect the member from the service, keeping their PDS account.
      description: |
        Removes membership, the service's operational data about the member,
        and every public representation the service generated. The PDS
        account, its DID, its handle, and its records are untouched.

        Available regardless of membership status. Reconnecting requires a
        new invitation. See `account-lifecycle.md` for how this differs from
        deleting content and from deleting the PDS account.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Disconnection request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectionReceipt"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service-disconnection-requests/{requestId}:
    get:
      operationId: getServiceDisconnection
      tags: [data]
      summary: Read the status of a disconnection request.
      description: |
        A completed or failed receipt stays queryable for 24 hours and is
        then hard-deleted, after which this returns `record-not-found`.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Disconnection request state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectionReceipt"
        default:
          $ref: "#/components/responses/Problem"

  /v1/account/deletion-requests:
    post:
      operationId: requestAccountDeletion
      deprecated: true
      tags: [data]
      summary: Deprecated alias for service disconnection.
      description: |
        Deprecated: the name describes something this never did. It does not
        delete an account. Use `POST /v1/service-disconnection-requests`.
        Behaviour is identical; this alias is scheduled for removal in v1.0.0.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Disconnection request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectionReceipt"
        default:
          $ref: "#/components/responses/Problem"

  /v1/account/deletion-requests/{requestId}:
    get:
      operationId: getAccountDeletion
      deprecated: true
      tags: [data]
      summary: Deprecated alias for reading a disconnection request.
      description: |
        Deprecated. Use `GET /v1/service-disconnection-requests/{requestId}`.
      security:
        - pdsSession: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Disconnection request state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectionReceipt"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    pdsSession:
      type: http
      scheme: bearer
      description: PDS session access token (JWT) presented as a Bearer credential.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated opaque key (for example a UUID). Retrying a request
        with the same key MUST NOT repeat its side effects; the server
        replays the original outcome.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RecordKey:
      name: rkey
      in: path
      required: true
      description: Record key of the target record in the member's repository.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    RequestID:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The record CID last read by the client, as a quoted strong entity
        tag: `"bafyrei…"`. The server forwards it to the PDS as a
        compare-and-swap, so a record that changed in the meantime is
        rejected with `record-conflict` (412) and left untouched.

        Omitting the header makes the mutation unconditional. Malformed or
        unquoted values are rejected with `invalid-request` (400).
      schema:
        type: string
        pattern: '^"[A-Za-z0-9]+"$'
      examples:
        quotedCID:
          value: '"bafyreiexamplecid"'

  headers:
    ETag:
      description: |
        The record's CID as a strong entity tag. This identifies the record
        revision, not a hash of the response body, so it must not be used
        for HTTP response caching — only fed back as `If-Match`.
      schema:
        type: string
      example: '"bafyreiexamplecid"'

  responses:
    Problem:
      description: Error described per RFC 7807.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Did:
      type: string
      description: Decentralized identifier of the member. The stable identifier for all member-scoped data.
      examples: ["did:plc:aaaabbbbccccddddeeeeffff"]

    Handle:
      type: string
      description: AT Protocol handle. Mutable presentation attribute.
      maxLength: 253
      examples: ["alice.handles.example.com"]

    AtUri:
      type: string
      description: AT URI of a record (`at://did/collection/rkey`). Permanent record identity.
      examples: ["at://did:plc:aaaabbbbccccddddeeeeffff/app.nooker.publication/3jt5mavarik22"]

    Session:
      type: object
      description: PDS session material for the client. Never logged or stored server-side.
      required: [accessJwt, refreshJwt]
      properties:
        accessJwt:
          type: string
        refreshJwt:
          type: string

    Member:
      type: object
      required: [did, handle, status]
      properties:
        did:
          $ref: "#/components/schemas/Did"
        handle:
          $ref: "#/components/schemas/Handle"
        status:
          type: string
          enum: [active, suspended, revoked]
          description: Suspended or revoked members retain access to export and deletion.

    PublicationInput:
      type: object
      description: Fields for an `app.nooker.publication` record. Constraints follow the Lexicon.
      required: [name, slug, language]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1000
        description:
          type: string
          maxLength: 6000
        slug:
          $ref: "#/components/schemas/Slug"
        language:
          type: string
          description: BCP-47 language tag.
          maxLength: 128

    Publication:
      type: object
      required: [uri, name, slug, language]
      properties:
        uri:
          $ref: "#/components/schemas/AtUri"
        cid:
          $ref: "#/components/schemas/CID"
        name:
          type: string
        description:
          type: string
        slug:
          $ref: "#/components/schemas/Slug"
        language:
          type: string
        urls:
          $ref: "#/components/schemas/PublicationUrls"

    CID:
      type: string
      description: |
        Content identifier of the record revision. Send it back as a quoted
        `If-Match` value to make a mutation conditional. Present on
        responses that read or write a record.
      examples: ["bafyreiexamplecid"]

    PublicationUrls:
      type: object
      required: [page, rss, atom]
      properties:
        page:
          type: string
          format: uri
        rss:
          type: string
          format: uri
        atom:
          type: string
          format: uri

    ArticleInput:
      type: object
      description: Fields for an `app.nooker.article` record. Constraints follow the Lexicon.
      required: [publication, title, content, slug]
      properties:
        publication:
          $ref: "#/components/schemas/AtUri"
        title:
          type: string
          minLength: 1
          maxLength: 3000
        content:
          type: string
          minLength: 1
          maxLength: 100000
          description: Markdown (CommonMark + GFM tables and strikethrough).
        summary:
          type: string
          maxLength: 6000
        slug:
          $ref: "#/components/schemas/Slug"
        publishedAt:
          type: string
          format: date-time
          description: Defaults to the server's current time when omitted.

    Article:
      type: object
      required: [uri, publication, title, slug, publishedAt]
      properties:
        uri:
          $ref: "#/components/schemas/AtUri"
        cid:
          $ref: "#/components/schemas/CID"
        publication:
          $ref: "#/components/schemas/AtUri"
        title:
          type: string
        slug:
          $ref: "#/components/schemas/Slug"
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: |
            Canonical public URL as currently served, built from the slug.
            Clients display and share this value and must not assemble it
            themselves; the canonical form can change without the record
            changing.
        aliasUrl:
          type: string
          format: uri
          description: |
            Permanent record-key URL. It never changes, and redirects to the
            canonical URL, so it is the safe form to embed anywhere durable.

    Slug:
      type: string
      description: Lowercase ASCII letters, digits, and hyphens; no leading or trailing hyphen.
      minLength: 1
      maxLength: 60
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"

    ExportJob:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        downloadUrl:
          type: string
          format: uri
          description: Present when completed. Time-limited URL for the export archive.

    DisconnectionReceipt:
      type: object
      description: |
        Status of a service-disconnection request. Retained for 24 hours
        after completion or failure, then hard-deleted. Fields are limited to
        this set on purpose: the point of disconnection is removing
        service-held data, so the receipt must not reintroduce a handle, an
        email address, or any content.
      required: [id, ownerDid, status, createdAt]
      properties:
        id:
          type: string
        ownerDid:
          $ref: "#/components/schemas/Did"
        status:
          type: string
          enum: [pending, processing, completed, failed]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        failureCode:
          type: string
          description: Normalised, non-sensitive reason. Present only when failed.

    Problem:
      type: object
      description: RFC 7807 problem document. Never contains tokens, passwords, invitation codes, emails, or article content.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the error type. Defaults to `about:blank`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        reason:
          type: string
          description: >
            Machine-readable cause, more specific than `type`. Present only when
            the cause is one a client should phrase in its own words: `detail` is
            English prose written for a developer reading a log, so a client that
            shows it to a user shows untranslated text. Clients MUST treat an
            unrecognised value as absent and fall back to `type`. Values are
            added additively and never repurposed.
          enum:
            - email-already-used
            - email-invalid
            - password-too-weak
            - handle-taken
            - handle-invalid
            - invitation-not-found
            - invitation-expired
            - invitation-exhausted
            - account-password-mismatch
            - repository-host-rejected
          examples: ["email-already-used"]
